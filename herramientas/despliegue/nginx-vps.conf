# Nginx del VPS (fuera de Docker) para el CRM MaxiConecta (docs/despliegue/docker.md).
# Copiar a /etc/nginx/sites-available/crm-maxiconecta, reemplazar los dominios y enlazar en sites-enabled.
#   - Sitio (crm.tudominio.com): archivos de Angular en /var/www/crm-maxiconecta (los copia el workflow);
#     sus llamadas a /api van al API Gateway en el mismo dominio, sin CORS.
#   - API (api.crm.tudominio.com): todo al API Gateway.
# El Gateway escucha solo en 127.0.0.1:8080; valida el JWT o el token de servicio y consulta a los
# microservicios por la red interna de Docker. Los microservicios no se publican.
# HTTPS: sudo certbot --nginx -d crm.tudominio.com -d api.crm.tudominio.com

upstream crm_api_gateway {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name crm.tudominio.com;
    root /var/www/crm-maxiconecta;
    client_max_body_size 10m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://crm_api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Los archivos de Angular llevan hash en el nombre: se pueden cachear.
    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
        expires 30d;
        try_files $uri =404;
    }

    # Rutas de la SPA: cualquier ruta desconocida carga index.html (que no se cachea).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name api.crm.tudominio.com;
    client_max_body_size 10m;

    location / {
        proxy_pass http://crm_api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
