# Nginx del VPS (fuera de Docker) para el CRM MaxiConecta (docs/despliegue/docker.md).
# Copiar a /etc/nginx/sites-available/crm-maxiconecta, reemplazar los dominios y enlazar en sites-enabled.
#   - Sitio (crm.tudominio.com): contenedor crm-web (127.0.0.1:8090); sus llamadas a /api van al API
#     Gateway en el mismo dominio, sin CORS.
#   - API (api.crm.tudominio.com): todo al API Gateway (127.0.0.1:8080).
# Ambos contenedores escuchan solo en localhost. El Gateway valida el JWT o el token de servicio y consulta
# a los microservicios por la red interna de Docker; los microservicios no se publican.
# HTTPS: sudo certbot --nginx -d crm.tudominio.com -d api.crm.tudominio.com

upstream crm_web {
    server 127.0.0.1:8090;
    keepalive 8;
}

upstream crm_api_gateway {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name crm.tudominio.com;
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://crm_api_gateway;
        include /etc/nginx/snippets/crm-proxy.conf;
    }

    location / {
        proxy_pass http://crm_web;
        include /etc/nginx/snippets/crm-proxy.conf;
    }
}

server {
    listen 80;
    server_name api.crm.tudominio.com;
    client_max_body_size 10m;

    location / {
        proxy_pass http://crm_api_gateway;
        include /etc/nginx/snippets/crm-proxy.conf;
    }
}
