server:
  port: ${PUERTO:8082}

crm:
  perfil:
    url: ${SERVICIO_PERFIL_URL:http://localhost:8081}
    tiempo-espera: ${PERFIL_TIEMPO_ESPERA:2s}

spring:
  application:
    name: servicio-comportamiento

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crm_maxiconecta}
    username: ${DB_USUARIO:crm}
    password: ${DB_PASSWORD:crm}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  flyway:
    schemas: comportamiento
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PUERTO:5672}
    username: ${RABBIT_USUARIO:guest}
    password: ${RABBIT_PASSWORD:guest}
    listener:
      simple:
        # Si un mensaje no se puede ni anotar en la bitácora, se reintenta y luego va a la cola de respaldo.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 2

comportamiento:
  inactividad:
    # Días sin ninguna compra vigente para considerar inactivo a un cliente (SCRUM-295).
    umbral-dias: ${INACTIVIDAD_UMBRAL_DIAS:90}
    # Cuándo corre la identificación automática (SCRUM-297); por defecto, una vez al día de madrugada.
    cron: ${INACTIVIDAD_CRON:0 0 3 * * *}
  nivel-consumo:
    # Valor acumulado (en bolivianos) desde el que un cliente es de consumo medio y alto (SCRUM-270).
    umbral-medio: ${NIVEL_CONSUMO_UMBRAL_MEDIO:500}
    umbral-alto: ${NIVEL_CONSUMO_UMBRAL_ALTO:5000}
    # Cuándo se reclasifica a todos los clientes (SCRUM-268); por defecto, una vez al día de madrugada.
    cron: ${NIVEL_CONSUMO_CRON:0 30 3 * * *}

management:
  endpoints:
    web:
      exposure:
        include: health
