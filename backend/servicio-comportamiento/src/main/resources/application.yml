server:
  port: ${PUERTO:8082}

crm:
  mensajeria:
    # Broker de mensajería: rabbit (predeterminado) o pubsub (perfil "pubsub"). Ver docs/mensajeria/pubsub.md.
    broker: rabbit
  perfil:
    url: ${SERVICIO_PERFIL_URL:http://localhost:8081}
    tiempo-espera: ${PERFIL_TIEMPO_ESPERA:2s}
  segmentacion:
    # Segmento y compañeros de segmento para la sugerencia de categorías afines (SCRUM-44).
    url: ${SERVICIO_SEGMENTACION_URL:http://localhost:8083}
    tiempo-espera: ${SEGMENTACION_TIEMPO_ESPERA:2s}

spring:
  application:
    name: servicio-comportamiento

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crm_maxiconecta}
    username: ${DB_USUARIO:crm}
    password: ${DB_PASSWORD:crm}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  flyway:
    schemas: comportamiento
    locations: classpath:db/migration

  # Google Cloud Pub/Sub solo se activa con el perfil "pubsub" (application-pubsub.yml).
  cloud:
    gcp:
      core:
        enabled: false
      pubsub:
        enabled: false

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PUERTO:5672}
    username: ${RABBIT_USUARIO:guest}
    password: ${RABBIT_PASSWORD:guest}
    listener:
      simple:
        # Si un mensaje no se puede ni anotar en la bitácora, se reintenta y luego va a la cola de respaldo.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 2

comportamiento:
  consumo-periodo:
    # Zona horaria del negocio con la que cada compra se asigna a su día en la consulta por periodo (SCRUM-39).
    zona-horaria: ${CONSUMO_PERIODO_ZONA_HORARIA:America/La_Paz}
  inactividad:
    # Días sin ninguna compra vigente para considerar inactivo a un cliente (SCRUM-295).
    umbral-dias: ${INACTIVIDAD_UMBRAL_DIAS:90}
    # Cuándo corre la identificación automática (SCRUM-297); por defecto, una vez al día de madrugada.
    cron: ${INACTIVIDAD_CRON:0 0 3 * * *}

  evolucion:
    # Zona horaria del negocio con la que cada compra se asigna a su mes, trimestre o año (SCRUM-32).
    zona-horaria: ${EVOLUCION_ZONA_HORARIA:America/La_Paz}

  nivel-consumo:
    # Valor acumulado (en bolivianos) desde el que un cliente es de consumo medio y alto (SCRUM-270).
    umbral-medio: ${NIVEL_CONSUMO_UMBRAL_MEDIO:500}
    umbral-alto: ${NIVEL_CONSUMO_UMBRAL_ALTO:5000}
    # Cuándo se reclasifica a todos los clientes (SCRUM-268); por defecto, una vez al día de madrugada.
    cron: ${NIVEL_CONSUMO_CRON:0 30 3 * * *}

  clasificacion-frecuencia:
    # Compras vigentes desde las que un cliente es habitual y frecuente; con al menos una, ocasional (SCRUM-341).
    umbral-habitual: ${CLASIFICACION_FRECUENCIA_UMBRAL_HABITUAL:4}
    umbral-frecuente: ${CLASIFICACION_FRECUENCIA_UMBRAL_FRECUENTE:10}

  cambio-comportamiento:
    # Periodo actual y línea base de la detección de cambios de comportamiento (SCRUM-316):
    # se comparan los últimos ventana-dias con el promedio por periodo de los periodos-base anteriores.
    ventana-dias: ${CAMBIO_COMPORTAMIENTO_VENTANA_DIAS:90}
    periodos-base: ${CAMBIO_COMPORTAMIENTO_PERIODOS_BASE:3}
    # Compras vigentes mínimas en la línea base para no quedar "sin línea base" (SCRUM-318).
    minimo-compras-base: ${CAMBIO_COMPORTAMIENTO_MINIMO_COMPRAS_BASE:3}
    # Desvío relativo (0.5 = 50 %) desde el que una variación es relevante; mayor que 0 y como máximo 1.
    umbral: ${CAMBIO_COMPORTAMIENTO_UMBRAL:0.5}
    # Cuándo se evalúa a todos los clientes (SCRUM-34); por defecto, una vez al día de madrugada.
    cron: ${CAMBIO_COMPORTAMIENTO_CRON:0 0 4 * * *}
  sugerencias:
    # Sugerencia de categorías afines (SCRUM-380): una categoría se sugiere si la compran al menos
    # minimo-clientes compañeros de segmento y al menos esa proporción (afinidad-minima) del segmento.
    minimo-clientes: ${SUGERENCIAS_MINIMO_CLIENTES:2}
    afinidad-minima: ${SUGERENCIAS_AFINIDAD_MINIMA:0.20}
    # Cantidad de categorías sugeridas por cliente.
    maximo: ${SUGERENCIAS_MAXIMO:5}
  cohortes:
    # Zona horaria en la que se cuentan los meses de las cohortes de primera compra (SCRUM-327).
    zona: ${COHORTES_ZONA:America/La_Paz}

management:
  health:
    pubsub:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
