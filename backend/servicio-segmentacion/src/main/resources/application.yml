server:
  port: ${PUERTO:8083}

spring:
  application:
    name: servicio-segmentacion

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crm_maxiconecta}
    username: ${DB_USUARIO:crm}
    password: ${DB_PASSWORD:crm}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  flyway:
    schemas: segmentacion
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PUERTO:5672}
    username: ${RABBIT_USUARIO:guest}
    password: ${RABBIT_PASSWORD:guest}
    listener:
      simple:
        # Un mensaje de métricas que falla por un error transitorio se reintenta y luego va a la
        # cola de respaldo (SCRUM-26); uno inválido va a respaldo de inmediato.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 2

management:
  endpoints:
    web:
      exposure:
        include: health

crm:
  # Nombres de los clientes del listado por segmento (SCRUM-277).
  perfil:
    url: ${SERVICIO_PERFIL_URL:http://localhost:8081}
    tiempo-espera: ${PERFIL_TIEMPO_ESPERA:2s}
