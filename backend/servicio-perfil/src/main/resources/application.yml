server:
  port: ${PUERTO:8081}

spring:
  application:
    name: servicio-perfil

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crm_maxiconecta}
    username: ${DB_USUARIO:crm}
    password: ${DB_PASSWORD:crm}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  flyway:
    schemas: perfil
    locations: classpath:db/migration

  # Google Cloud Pub/Sub solo se activa con el perfil "pubsub" (application-pubsub.yml).
  cloud:
    gcp:
      core:
        enabled: false
      pubsub:
        enabled: false

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PUERTO:5672}
    username: ${RABBIT_USUARIO:guest}
    password: ${RABBIT_PASSWORD:guest}
    listener:
      simple:
        # Si un mensaje no se puede ni anotar en la bitácora, se reintenta y luego va a la cola de respaldo.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 2

management:
  health:
    pubsub:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health

crm:
  mensajeria:
    # Broker de mensajería: rabbit (predeterminado) o pubsub (perfil "pubsub"). Ver docs/mensajeria/pubsub.md.
    broker: rabbit
  perfil:
    reintentos:
      # Errores técnicos transitorios al aplicar un evento: intentos en total y espera creciente.
      maximo: 3
      espera-inicial: 500ms
      multiplicador: 2
  # Servicios consultados para consolidar la ficha integral del cliente (SCRUM-10).
  comportamiento:
    url: ${SERVICIO_COMPORTAMIENTO_URL:http://localhost:8082}
    tiempo-espera: ${COMPORTAMIENTO_TIEMPO_ESPERA:2s}
  segmentacion:
    url: ${SERVICIO_SEGMENTACION_URL:http://localhost:8083}
    tiempo-espera: ${SEGMENTACION_TIEMPO_ESPERA:2s}
  fidelizacion:
    url: ${SERVICIO_FIDELIZACION_URL:http://localhost:8084}
    tiempo-espera: ${FIDELIZACION_TIEMPO_ESPERA:2s}
