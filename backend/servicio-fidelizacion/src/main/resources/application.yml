server:
  port: ${PUERTO:8084}

crm:
  mensajeria:
    # Broker de mensajería: rabbit (predeterminado) o pubsub (perfil "pubsub"). Ver docs/mensajeria/pubsub.md.
    broker: rabbit
  perfil:
    # Vincula el cliente de Marketplace y Ventas de cada movimiento con su perfil del CRM (SCRUM-45).
    url: ${SERVICIO_PERFIL_URL:http://localhost:8081}
    tiempo-espera: ${PERFIL_TIEMPO_ESPERA:2s}

fidelizacion:
  salida:
    enabled: ${FIDELIZACION_SALIDA_ENABLED:false}
    topico: ${FIDELIZACION_SALIDA_TOPICO:ucb-sis323-sub-b}
    intervalo-ms: ${FIDELIZACION_SALIDA_INTERVALO_MS:5000}
    lote: ${FIDELIZACION_SALIDA_LOTE:20}
    espera-segundos: ${FIDELIZACION_SALIDA_ESPERA_SEGUNDOS:10}
  puntos:
    # SCRUM-525: meses de vigencia del saldo desde la última acumulación (RIO-CRM-04 y la caducidad, SCRUM-50).
    # Es el valor inicial del parámetro general PUNTOS_VIGENCIA_MESES, que luego cambia el Administrador (SCRUM-517).
    vigencia-meses: ${FIDELIZACION_VIGENCIA_MESES:12}
  caducidad:
    # SCRUM-415: proceso diario de caducidad de puntos, antes del recálculo de niveles.
    cron: ${FIDELIZACION_CADUCIDAD_CRON:0 0 2 * * *}
    zona-horaria: ${FIDELIZACION_ZONA_HORARIA:America/La_Paz}
  niveles:
    # SCRUM-49: recálculo nocturno de los niveles (las compras antiguas salen del periodo de evaluación).
    recalculo-cron: ${FIDELIZACION_NIVELES_CRON:0 30 2 * * *}
    zona-horaria: ${FIDELIZACION_ZONA_HORARIA:America/La_Paz}

spring:
  application:
    name: servicio-fidelizacion

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crm_maxiconecta}
    username: ${DB_USUARIO:crm}
    password: ${DB_PASSWORD:crm}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  flyway:
    schemas: fidelizacion
    locations: classpath:db/migration

  # Google Cloud Pub/Sub solo se activa con el perfil "pubsub" (application-pubsub.yml).
  cloud:
    gcp:
      core:
        enabled: false
      pubsub:
        enabled: false

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PUERTO:5672}
    username: ${RABBIT_USUARIO:guest}
    password: ${RABBIT_PASSWORD:guest}
    listener:
      simple:
        # Si un mensaje no se puede ni anotar en la bitácora, se reintenta y luego va a la cola de respaldo.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 2

management:
  health:
    pubsub:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
